[project]
name = "strat-backtester"
version = "0.2.0"
description = "Pluggable options-strategy backtesting engine with risk metrics, a Streamlit dashboard and PDF tearsheets"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shreyas Deb" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
app = [
    "yfinance",
    "streamlit",
    "plotly",
    "statsmodels",   # plotly's OLS trendline
]
data = [
    "yfinance",      # real market data from Yahoo Finance (NSE, NASDAQ, NYSE, ...)
]
agent = [
    "mcp>=2",        # Model Context Protocol server: `stratbt mcp`
    "yfinance",
]
alpaca = ["alpaca-py"]         # live/paper trading on Alpaca (US equities and options)
ibkr = ["ib_async"]            # Interactive Brokers via TWS / IB Gateway (global markets, incl. NSE)
public = ["publicdotcom-py"]   # Public.com
brokers = ["alpaca-py", "ib_async", "publicdotcom-py"]
notebooks = [
    "jupyterlab",
    "ipykernel",
]

[project.scripts]
stratbt = "stratbt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratbt"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "streamlit",
    "plotly",
    "statsmodels",
    "yfinance",
    "mcp>=2",
    "alpaca-py",
    "ib_async",
    "publicdotcom-py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

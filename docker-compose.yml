services:
  stratbt:
    build: .
    container_name: strat_backtester
    ports:
      - "8501:8501"
    volumes:
      # Optional: mount NSE tick data (NSE_YYYYMMDD/ folders) read-only.
      # Without it the dashboard uses the built-in synthetic market.
      - ${STRATBT_DATA_DIR:-./data/allData}:/data:ro
    restart: unless-stopped

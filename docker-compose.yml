services:
  stratbt:
    build: .
    container_name: strat_backtester
    ports:
      - "8501:8501"
    environment:
      # yahoo (real prices, needs internet) or synthetic (offline)
      STRATBT_SOURCE: ${STRATBT_SOURCE:-yahoo}
    volumes:
      - stratbt-cache:/root/.cache/stratbt      # downloaded bars survive restarts
    restart: unless-stopped

volumes:
  stratbt-cache:
